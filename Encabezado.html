<!DOCTYPE html> <!-- declara el tipo de html que se te utilizara -->
<html lang="es"> <!-- indica el idioma en el que se utilizara la pagina -->

<head> <!-- guarda los datos que no se muestran al usuario -->
    <meta charset="UTF-8"> <!-- indica al navegador que caracteres utilizar para que se muestre correctamente -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- se utiliza para optimizar la pagina en telefonos -->
    <title>Encabezados HTML</title> <!-- define el titulo que se mostrara en la pestaña -->
</head> <!-- cierra la seccion de head -->

<body> <!-- seccion donde se mostrara todo lo de pantalla -->
    <h1>Titulo 1</h1> <!-- titulo mas grande -->
    <h2>Titulo 2</h2> <!-- se utiliza para secciones importantes de una pagina -->
    <h3>Titulo 3</h3> <!-- subsecciones de h2 -->
    <h4>Titulo 4</h4> <!-- subtemas de menor jerarquia -->
    <h5>Titulo 5</h5> <!-- se utiliza para secciones mas profundas de h4 -->
    <h6>Titulo 6</h6> <!-- nivel mas bajo de la jerarquia -->

</body> <!-- cierre de la seccion body -->
