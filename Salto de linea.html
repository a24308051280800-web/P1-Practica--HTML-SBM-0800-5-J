<!DOCTYPE html> <!-- declara el tipo de html que se te utilizara --> 
<html lang="es"> <!-- indica el idioma en el que se utilizara la pagina --> 

<head> <!-- guarda los datos que no se uestran al usuario --> 
	<meta charset="UTF-8"> <!-- indica al navegador que caracteres utilizar para que se muestre correctamente --> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- se utiliza para optimizar la pagina en telefonos --> 
	<title>Salto de linea en HTML</title> <!-- define el titulo que se mostrara en la pestaña --> 
</head> <!-- cierra la seccion de head --> 

<body> <!-- seccion donde se mostrara todo lo de pantalla --> 
    <h1>Lenguaje de programacion</h1> <!-- titulo mas grande --> 
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br> <!-- se muestra el texto y se hace un salto de linea --> 
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p> <!-- cierre del texto --> 
</body> <!-- cierre del body --> 

</html> <!-- cierre del html -->
