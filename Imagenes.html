<!DOCTYPE html> <!-- declara el tipo de html que se te utilizara --> 
<html lang="en"> <!-- indica el idioma en el que se utilizara la pagina -->
<head> <!-- guarda los datos que no se uestran al usuario --> 

    <meta charset="UTF-8"> <!-- indica al navegador que caracteres utilizar para que se muestre correctamente --> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- se utiliza para optimizar la pagina en telefonos --> 
    <title>Imagenes en HTML</title> <!-- define el titulo que se mostrara en la pestaña --> 
</head> <!-- cierra la seccion de head --> 

<body> <!-- seccion donde se mostrara todo lo de pantalla -->
    <h2>Imagenes en HTML</h2> <!-- se utiliza para secciones importantes de una pagina -->
    <h3>Locales</h3> <!-- subsecciones de h2 -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- Esta línea inserta una imagen local (llamada caritas.png) con el texto alternativo "Imagen de carita feliz" para la accesibilidad. -->
    <h3>Locales redismensionado</h3> <!-- subsecciones de h2 -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- Esta línea inserta una imagen local dentro de la subcarpeta imagenes, con texto alternativo vacío, dimensiones fijas (200x100px) -->
    <h3>Desde internet</h3> <!-- subsecciones de h2 -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt=""> <!-- Esta línea inserta una imagen externa (vía enlace web URL) con texto alternativo vacío y dimensiones de 200x200 píxeles. -->
    <h3>Animaciones</h3> <!-- subsecciones de h2 -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""> <!-- Esta línea inserta una imagen animada (GIF) externa proveniente de Giphy, con texto alternativo vacío y dimensiones de 200x200 píxeles. -->

</body> <!-- cierre de la seccion body -->

</html> <!-- cierre del html -->
